name: apkg-lint
description: Offline preflight and CI linting for Anki .apkg decks
author: KanadeK

branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: APKG file or directory to inspect
    required: true
  profile:
    description: shared warns about bundled learning progress; backup preserves it
    default: shared
  fail-on:
    description: error, warning, info, or none
    default: warning
  format:
    description: text, json, html, or sarif
    default: sarif
  output:
    description: Report path
    default: apkg-lint.sarif
  verify-media:
    description: Set false to skip media decompression and hashes
    default: "true"

outputs:
  report:
    description: Path to the generated report
    value: ${{ inputs.output }}

runs:
  using: composite
  steps:
    - name: Install apkg-lint from this Action
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$ACTION_ROOT"

    - name: Inspect APKG package
      shell: bash
      env:
        APKG_PATH: ${{ inputs.path }}
        APKG_PROFILE: ${{ inputs.profile }}
        APKG_FAIL_ON: ${{ inputs['fail-on'] }}
        APKG_FORMAT: ${{ inputs.format }}
        APKG_OUTPUT: ${{ inputs.output }}
        APKG_VERIFY_MEDIA: ${{ inputs['verify-media'] }}
      run: |
        set -euo pipefail
        args=(check "$APKG_PATH" --profile "$APKG_PROFILE" --fail-on "$APKG_FAIL_ON" --format "$APKG_FORMAT" --output "$APKG_OUTPUT")
        if [[ "$APKG_VERIFY_MEDIA" == "false" ]]; then
          args+=(--no-verify-media)
        fi
        apkg-lint "${args[@]}"
