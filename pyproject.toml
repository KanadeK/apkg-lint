[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "apkg-lint"
version = "0.1.0"
description = "Offline preflight and CI linting for Anki .apkg decks"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "anki",
  "apkg",
  "flashcards",
  "linter",
  "local-first",
  "spaced-repetition",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "zstandard>=0.23,<1",
]

[project.urls]
Homepage = "https://github.com/KanadeK/apkg-lint"
Documentation = "https://github.com/KanadeK/apkg-lint#readme"
Issues = "https://github.com/KanadeK/apkg-lint/issues"
Source = "https://github.com/KanadeK/apkg-lint"

[project.scripts]
apkg-lint = "apkg_lint.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "mypy>=2.3.0,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apkg_lint"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/scripts",
  "/docs",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/RELEASE_NOTES.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/action.yml",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["apkg_lint"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"scripts/**" = ["S603", "S607", "T201"]
"src/apkg_lint/cli.py" = ["PERF203", "PLR0911", "PLR0912", "PLR0915"]
"src/apkg_lint/reporting.py" = ["E501", "PERF401"]
"src/apkg_lint/rules.py" = ["E501", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["zstandard"]
ignore_missing_imports = true
